<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Metadata -->
    <title>Lucana | High-Performance Fishing Tackle & Premium Rigging</title>
    <meta name="description" content="Lucana designs high-performance tackle for tournament professionals and coastal anglers. Explore our elite reels, rods, and braided lines crafted from Toray carbon." />
    <meta name="keywords" content="fishing tackle, saltwater reels, carbon rods, tournament rigging, fishing gear, Lucana, braided fishing line, sport fishing" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Lucana Tackle Co." />
    <meta name="theme-color" content="#FAF9F9" />
    <link rel="canonical" href="https://lucanatackle.com" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lucanatackle.com" />
    <meta property="og:title" content="Lucana | High-Performance Fishing Tackle & Premium Rigging" />
    <meta property="og:description" content="Lucana designs high-performance tackle for tournament professionals and coastal anglers. Explore our elite reels, rods, and braided lines crafted from Toray carbon." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1544551763-46a013bb70d5?auto=format&fit=crop&q=80&w=1200" />
    <meta property="og:site_name" content="Lucana" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://lucanatackle.com" />
    <meta name="twitter:title" content="Lucana | High-Performance Fishing Tackle & Premium Rigging" />
    <meta name="twitter:description" content="Lucana designs high-performance tackle for tournament professionals and coastal anglers. Explore our elite reels, rods, and braided lines." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1544551763-46a013bb70d5?auto=format&fit=crop&q=80&w=1200" />

    <!-- Structured Data: Organization + WebSite (site-wide) -->
    <script type="application/ld+json">
      [
        {
          "@context": "https://schema.org",
          "@type": "Organization",
          "@id": "https://lucanatackle.com/#organization",
          "name": "Lucana",
          "url": "https://lucanatackle.com",
          "description": "Premium, modern e-commerce platform for high-performance fishing tackle, including reels, rods, lines, hooks, lures, and bags.",
          "image": "https://images.unsplash.com/photo-1544551763-46a013bb70d5?auto=format&fit=crop&q=80&w=800",
          "telephone": "+1-800-LUCANA-9",
          "email": "support@lucanatackle.com",
          "priceRange": "$$",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "700 Water St",
            "addressLocality": "Seattle",
            "addressRegion": "WA",
            "postalCode": "98104",
            "addressCountry": "US"
          },
          "sameAs": [
            "https://www.facebook.com/lucanatackle",
            "https://www.instagram.com/lucanatackle",
            "https://twitter.com/lucanatackle",
            "https://www.youtube.com/@lucanatackle"
          ]
        },
        {
          "@context": "https://schema.org",
          "@type": "WebSite",
          "@id": "https://lucanatackle.com/#website",
          "url": "https://lucanatackle.com",
          "name": "Lucana",
          "description": "High-performance fishing tackle: reels, rods, lines, hooks, lures, and bags.",
          "publisher": { "@id": "https://lucanatackle.com/#organization" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://lucanatackle.com/shop?search={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        }
      ]
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
